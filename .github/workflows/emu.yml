name: emu-session
on:
  workflow_dispatch:
    inputs:
      shevery_ref:
        description: "APK source: 'latest', 'tag <tag>', or 'run <run-id>' (debug artifact)"
        required: false
        default: "latest"
      api_level:
        description: "Android API level. 34-36 (Android 14-16) all verified with KVM; 37 unavailable (no platforms;android-37 in SDK)"
        required: false
        default: "35"
      hold_minutes:
        description: "Park session open for manual ADB (0 = off, max ~110)"
        required: false
        default: "90"
jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1800
          script: chmod +x scripts/*.sh && scripts/test.sh "${{ inputs.shevery_ref }}" "${{ inputs.hold_minutes }}"
        env:
          GH_TOKEN: ${{ secrets.SHEVERY_ACCESS_TOKEN }}
